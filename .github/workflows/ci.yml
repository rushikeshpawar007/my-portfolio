name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run audit:deps

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:server

      - run: npm run build:css

      # GitHub Pages serves the committed bundles; fail when generated CSS is stale.
      - run: |
          git ls-files --error-unmatch styles/tailwind.css styles/site.min.css styles/legal.min.css
          git diff --exit-code styles/tailwind.css styles/site.min.css styles/legal.min.css

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npx playwright test

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
